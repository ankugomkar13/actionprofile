name: CI/CD Pipeline workflow

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main  
  workflow_dispatch:    
  schedule:
    - cron: '0 0 * * *'        

permissions:
  contents: read  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout Repository 
       uses: actions/checkout@v4
       with:
          fetch-depth: 0   

     - name: Mvn Build
       run: mvn clean install  
       
     - name: Upload Build Artifacts (war)
       uses: actions/upload-artifact@v4
       with:
         name: build-artifacts
         path: target/*.war  

     - name: Notify if the build fails
       if: failure()  
       run: echo "Build failed! Please check the logs."  


  Testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
     - name: Checkout Repository 
       uses: actions/checkout@v4
       with:
          fetch-depth: 0  

     - name: run theMvn Test
       if: github.ref == 'refs/heads/main'
       run: mvn test

     - name: Checkstyle
       if: github.ref == 'refs/heads/main' 
       run: mvn checkstyle:checkstyle

     - name: Run test on other branch
       if: github.ref != 'refs/heads/main' 
       run: echo "Skipping unit test"

