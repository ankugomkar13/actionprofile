name: CI/CD Pipeline workflow

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main  
  workflow_dispatch:    
  schedule:
    - cron: '0 0 * * *'
env:
  ECR_REPOSITORY: vprofileappimg #ECR_REPOSITORY: it will give the name of the ECR repository to which we will push the Docker image
permissions:
  contents: read  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout Repository 
       uses: actions/checkout@v5
       with:
          fetch-depth: 0   

     - name: Mvn Build
       run: mvn clean install  
       
     - name: Upload Build Artifacts (war)
       uses: actions/upload-artifact@v5
       with:
         name: build-artifacts
         path: target/*.war  

     - name: Notify if the build fails
       if: failure()  
       run: echo "Build failed! Please check the logs."  


  Testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
     - name: Checkout Repository 
       uses: actions/checkout@v5
       with:
          fetch-depth: 0  

     - name: run theMvn Test
       if: github.ref == 'refs/heads/main'
       run: mvn test

     - name: Checkstyle
       if: github.ref == 'refs/heads/main' 
       run: mvn checkstyle:checkstyle

     - name: Run test on other branch
       if: github.ref != 'refs/heads/main' 
       run: echo "Skipping unit test"

  Security_Scan:  
    runs-on: ubuntu-latest
    needs: build
    steps:
     - name: Checkout Repository 
       uses: actions/checkout@v5
       with:
          fetch-depth: 0  

     - name: Run  trivy foler security scan
       uses: aquasecurity/trivy-action@master
       with:
         scan-type: 'fs'
         scan-ref: './'  
         format: 'json'  
         exit-code: '0'
         output: 'trivy-scan-results.json'
       
     - name: Upload trivy scan result as artifact
       uses: actions/upload-artifact@v5
       with:
         name: trivy-scan-results
         path: trivy-scan-results.json

  BUILD_AND_PUBLISH:
      name: Build and Publish Docker Image
      runs-on: ubuntu-latest
      environment: production
      needs: [build, Testing, Security_Scan]      
      if: github.ref == 'refs/heads/main'
      steps:
       - name: Checkout Repository 
         uses: actions/checkout@v5
         with:
            fetch-depth: 0  

       - name: Configure AWS Credentials #Configure AWS credentials for ECR access
         uses: aws-actions/configure-aws-credentials@v2
         with:
           aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
           aws-region: ${{ vars.AWS_REGION }}

       - name: Login to Amazon ECR
         id: ecr-login
         uses: aws-actions/amazon-ecr-login@v1
       
       - name: Build, tag and push Docker image to ECR
         id: build-image
         env: 
           ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }} #ECR_REGISTRY: it will give the name of the ECR registry to which we will push the Docker image 
           IMAGE_TAG: ${{ github.sha }}
         run: |
           docker build -f Docker-files/app/multistage/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG . #Build the Docker image using the multistage Dockerfile
           docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG #Push the Docker image to
           echo "Docker image pushed to ECR: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
